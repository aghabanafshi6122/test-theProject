name: Sync JinX-X4G to My Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone source repo
        env:
          SRC_TOKEN: ${{ secrets.SRC_TOKEN }}
        run: |
          set -e
          SRC_DIR="/tmp/jinx-src"
          rm -rf "$SRC_DIR"

          if [ -n "$SRC_TOKEN" ]; then
            URL="https://x-access-token:${SRC_TOKEN}@github.com/x4gpanell/JinX-X4G.git"
          else
            URL="https://github.com/x4gpanell/JinX-X4G.git"
          fi

          echo "Cloning from GitHub..."
          git clone --depth 1 "$URL" "$SRC_DIR" || {
            echo "::error::Clone failed with exit $?"
            exit 1
          }

      - name: Copy files
        run: |
          set -e
          # پاک‌سازی محتوا جز .git و .github
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          # کپی محتوا
          shopt -s dotglob
          cp -r /tmp/jinx-src/* .
          shopt -u dotglob

          # حذف .git داخل مبدأ اگر منتقل شد
          rm -rf /tmp/jinx-src

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit & Push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "چیزی برای کامیت نیست."
          else
            git commit -m "Railway Deploy"
            git push
          fi
