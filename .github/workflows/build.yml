name: Sync JinX-X4G to My Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone source repo
        run: |
          set -e
          SRC_DIR="/tmp/jinx-src"
          rm -rf "$SRC_DIR"
          git clone --depth 1 https://github.com/x4gpanell/JinX-X4G.git "$SRC_DIR"

      - name: Copy files (excluding .git)
        run: |
          set -e
          # حذف .git مخزن مبدأ - این حیاتی است!
          rm -rf /tmp/jinx-src/.git

          # پاک‌سازی محتوای پروژه به جز .git و .github
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          # کپی همه‌ی محتوا جز .git مخزن مبدأ
          cp -r /tmp/jinx-src/. .

          # اطمینان از اینکه .git مخزن خودمان دست نخورده
          git status --short | head -20

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit & Push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "چیزی برای کامیت نیست."
          else
            git commit -m "Railway Deploy"
            git push
          fi
