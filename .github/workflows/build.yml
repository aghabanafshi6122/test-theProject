name: Sync JinX-X4G to My Project

on:
  # اجرای دستی از تب Actions
  workflow_dispatch:

  # اجرا با هر push روی برنچ main (اختیاری)
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone source repo (JinX-X4G)
        run: |
          git clone --depth 1 https://github.com/x4gpanell/JinX-X4G.git /tmp/jinx-src

      - name: Copy files into my project
        run: |
          # پاک کردن فایل‌های قبلی (به جز .git و .github)
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          # کپی همه‌ی محتوای مخزن مبدأ
          cp -r /tmp/jinx-src/. .

          # حذف .git مخزن مبدأ اگر کپی شده
          rm -rf .git-src

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit & Push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "چیزی برای کامیت نیست."
          else
            git commit -m "Railway Deploy"
            git push
          fi
